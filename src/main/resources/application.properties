api.ruc.token=sk_21167.xTIlM46qEZLaVjmtp35RzAFq9j8UTBYN
# ============================================================
# Datos de demostración (Dashboard y Reportes).
# Si la base está VACÍA (sin ventas) al iniciar, se crea una tienda de ejemplo:
# 7 categorías, ~28 prendas, ~30 clientes, 5 proveedores, 5 usuarios y
# ~6 meses de ventas y compras con el stock cuadrado (el Kardex no sale negativo).
# En cada arranque se completan los días que falten hasta HOY.
# Si ya hay ventas reales (base no creada por el generador) NO se toca nada.
# Para empezar de cero: cierre la app y borre la carpeta data/. Ponga false para desactivarlo.
# ============================================================
db.demo.data=true
