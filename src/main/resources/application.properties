# ============================================================
# DDL: crea las tablas y carga los datos del caso al iniciar
# ============================================================
db.ddl.auto=true
db.ddl.script=schema_ropa.sql
# ============================================================
# Consulta RUC de empresas (RUC 20...). Token gratis en https://decolecta.com
# Los RUC 10... (personas) funcionan sin token usando el DNI.
